function saveData() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); } catch(e){} }

const fmt = n => (n === null || n === undefined || isNaN(n)) ? '' :
  Number(n).toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2});
const num = v => { const n = parseFloat(String(v).replace(/,/g,'')); return isNaN(n)?0:n; };
const sum = (arr, key) => arr.reduce((a,x)=>a + num(x[key]), 0);
function diffClass(v){ return Math.abs(v) < 0.01 ? 'ok' : 'bad'; }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 2000);
}

}

function getEntry(sheetKey, cc) {
  const d = DATA[sheetKey];
  if (!d) return {v100:0, v200:0};
  if (cc === '150') return d.dirGral || {v100:0, v200:0};
  return d.otros.find(o => o.cc === cc) || {v100:0, v200:0};
}

function renderSheet(sheetKey) {
  const d = DATA[sheetKey];
  const hasTerritorio = d.territorio !== null && d.territorio !== undefined;
  const totalAgencias100 = sum(d.agencias,'v100');
  const totalAgencias200 = sum(d.agencias,'v200');
  const totalOtros100 = sum(d.otros,'v100');
  const totalOtros200 = sum(d.otros,'v200');

  let cuadre100 = 0, cuadre200 = 0;
  if (hasTerritorio) {
    cuadre100 = num(d.territorio.v100) + totalAgencias100;
    cuadre200 = num(d.territorio.v200) + totalAgencias200;
  } else if (sheetKey === 'SERVICIOS TECNICOS') {
    cuadre100 = num(d.dirGral.v100) + totalOtros100;
    cuadre200 = num(d.dirGral.v200) + totalOtros200;
  } else if (sheetKey === 'JEFT') {
    cuadre100 = totalOtros100;
    cuadre200 = totalOtros200;
  }

  let totalPorCuentas100, totalPorCuentas200;
  if (hasTerritorio) {
    totalPorCuentas100 = cuadre100 + num(d.dirGral.v100) + totalOtros100;
    totalPorCuentas200 = cuadre200 + num(d.dirGral.v200) + totalOtros200;
  } else {
    totalPorCuentas100 = cuadre100;
    totalPorCuentas200 = cuadre200;
  }

  const dif100 = totalPorCuentas100 - num(d.saldo100);
  const dif200 = totalPorCuentas200 - num(d.saldo200);
  const showDiff = CONFIG.showDiffCol;

  let html = `<div class="sheet active"><h2>${d.nombre}</h2>
    <div class="sub">${d.subtitulo} · C. Costo ${d.ccosto}</div>
    <div class="toolbar no-print">
      <button onclick="printSheet()">🖨 Imprimir esta hoja</button>
      <button onclick="exportSheet('${sheetKey}')">⬇ Exportar plantilla</button>

function calcCuadre(sheetKey, r) {
  const d = DATA[sheetKey];
  const propio = getEntry(sheetKey, r.cc);
  const refItem = getEntry(r.ref, d.ccosto);
  return { v100: num(propio.v100) - num(refItem.v200), v200: num(propio.v200) - num(refItem.v100) };
}

function renderCuadres(sheetKey) {
  const config = getCuadresConfig();
  const rows = config[sheetKey] || [];
  let html = `<div class="cuadres-title">CUADRES (reciprocidad entre hojas)</div>
    <table><thead><tr><th>TERRITORIOS</th><th>C.C</th><th>696-100</th><th>696-200</th><th>Estado</th></tr></thead><tbody>`;
  rows.forEach(r => {
    const {v100, v200} = calcCuadre(sheetKey, r);
    const ok = Math.abs(v100) < 0.01 && Math.abs(v200) < 0.01;
    html += `<tr><td>${r.terr}</td><td>${r.cc}</td>
      <td class="num ${diffClass(v100)}">${fmt(v100)}</td>
      <td class="num ${diffClass(v200)}">${fmt(v200)}</td>
      <td>${ok ? '<span class="badge ok">✓ OK</span>' : '<span class="badge bad">✗ Diferencia</span>'}</td></tr>`;
  });
  html += `</tbody></table>`;
  return html;
}

function renderStats() {
  const config = getCuadresConfig();
  const pairMap = {};
  Object.keys(config).forEach(sheetKey => {
    config[sheetKey].forEach(r => {
      const key = [sheetKey, r.ref].sort().join('|');
      if (!pairMap[key]) pairMap[key] = { from: sheetKey, to: r.ref };
    });
  });
  const pairList = Object.values(pairMap).map(g => {
    const ccFrom = DATA[g.from].ccosto, ccTo = DATA[g.to].ccosto;
    const ida = getEntry(g.from, ccTo), vuelta = getEntry(g.to, ccFrom);
    const ida100 = num(ida.v100), ida200 = num(ida.v200);
    const vuel100 = num(vuelta.v100), vuel200 = num(vuelta.v200);
    const dif100 = ida100 - vuel200, dif200 = ida200 - vuel100;
    const absMax = Math.max(Math.abs(dif100), Math.abs(dif200));
    return { from: g.from, to: g.to, ccFrom, ccTo, ida100, ida200, vuel100, vuel200, dif100, dif200, absMax, ok: absMax < 0.01 };
  });
  pairList.sort((a, b) => { if (a.ok !== b.ok) return a.ok ? 1 : -1; return b.absMax - a.absMax; });

  const totalPairs = pairList.length;
  const badPairs = pairList.filter(g => !g.ok);
  const okPairs = pairList.filter(g => g.ok);
  const badCount = badPairs.length;
  const maxDiff = badCount ? badPairs[0].absMax : 0;
  const sumAbsDiff = badPairs.reduce((s,g) => s + g.absMax, 0);

  const PALETTE = [
    { border:'#c53030', bg:'#fff5f5', text:'#9b2c2c', light:'#fed7d7' },
    { border:'#c05621', bg:'#fffaf0', text:'#9c4221', light:'#feebc8' },
    { border:'#b7791f', bg:'#fffff0', text:'#975a16', light:'#fefcbf' },
    { border:'#2f855a', bg:'#f0fff4', text:'#276749', light:'#c6f6d5' },
    { border:'#285e61', bg:'#e6fffa', text:'#234e52', light:'#b2f5ea' },
    { border:'#2c5282', bg:'#ebf8ff', text:'#2a4365', light:'#bee3f8' },
    { border:'#4c51bf', bg:'#ebf4ff', text:'#3c366b', light:'#c3dafe' },
    { border:'#6b46c1', bg:'#faf5ff', text:'#553c9a', light:'#e9d8fd' },
    { border:'#b83280', bg:'#fff5f7', text:'#97266d', light:'#fed7e2' },
    { border:'#975a16', bg:'#fffaf0', text:'#744210', light:'#faf089' },
  ];

  let html = `<div class="sheet active"><h2>📊 Estadísticas de Cuadre</h2>
    <div class="sub">Comparación por contraparte: IDA 696-100 ↔ VUELTA 696-200 · IDA 696-200 ↔ VUELTA 696-100</div>
    <div class="toolbar no-print">
      <button onclick="printSheet()">🖨 Imprimir estadísticas</button>
    </div>
    <div class="kpi-grid">
      <div class="kpi"><div class="label">Pares únicos</div><div class="value">${totalPairs}</div></div>
      <div class="kpi ok"><div class="label">✓ Cuadres OK</div><div class="value">${okPairs.length}</div></div>
      <div class="kpi ${badCount ? 'bad' : 'ok'}"><div class="label">✗ Con diferencia</div><div class="value">${badCount}</div></div>
      <div class="kpi ${badCount ? 'warn' : 'ok'}"><div class="label">Mayor diferencia</div><div class="value">${fmt(maxDiff)}</div></div>
    </div>`;

  if (badCount === 0) {
    html += `<div class="success-panel"><span class="big">✅</span><strong>¡Todo cuadra!</strong><br>
      Los ${totalPairs} pares entre hojas están balanceados. No hay territorios con diferencias pendientes.</div>`;
  } else {
    html += `<h3 style="color:#1e3a5f; margin: 4px 0 12px;">⚠ Pares con diferencias (${badCount})</h3>
      <div class="pairs-container">`;
    badPairs.forEach((g, idx) => {
      const c = PALETTE[idx % PALETTE.length];
      html += `<div class="pair-card" style="border-left-color:${c.border}; background:${c.bg};">
        <div class="pair-header" style="color:${c.text};">
          <span class="pair-dot" style="background:${c.border};"></span>
          ${g.from} (${g.ccFrom}) ↔ ${g.to} (${g.ccTo})
        </div>
        <table class="compare-table">
          <thead><tr style="background:${c.light}; color:${c.text};">
            <th style="width:22%;">Comparación</th>
            <th style="width:26%;">➡ IDA · ${g.from} → ${g.to}</th>
            <th style="width:26%;">⬅ VUELTA · ${g.to} → ${g.from}</th>
            <th style="width:26%;">Diferencia</th>
          </tr></thead>
          <tbody>
            <tr>
              <td class="cc-pair" style="color:${c.text};">IDA 696-100<br>vs VUELTA 696-200</td>
              <td class="num">${fmt(g.ida100)}</td>
              <td class="num" style="background:${c.light}55;">${fmt(g.vuel200)}</td>
              <td class="num diff" style="color:${c.text};">${fmt(g.dif100)}</td>
            </tr>
            <tr>
              <td class="cc-pair" style="color:${c.text};">IDA 696-200<br>vs VUELTA 696-100</td>
              <td class="num">${fmt(g.ida200)}</td>
              <td class="num" style="background:${c.light}55;">${fmt(g.vuel100)}</td>
              <td class="num diff" style="color:${c.text};">${fmt(g.dif200)}</td>
            </tr>
          </tbody>
        </table>
      </div>`;
    });
    html += `</div>
      <div style="background:#fff8e6; border-left:4px solid #c05621; padding:12px 16px; border-radius:6px; font-size:.85rem; color:#7b341e; line-height:1.6; margin-top:16px;">
        <strong>Resumen:</strong> ${badCount} par(es) con diferencia · Suma de magnitudes: <strong>${fmt(sumAbsDiff)}</strong>
        <br><strong>Cómo leer:</strong> en cada fila se compara la cuenta de la IDA contra la cuenta <em>contraria</em> de la VUELTA (100 contra 200 y viceversa). La diferencia = valor IDA − valor VUELTA de la contraparte. Los ${okPairs.length} pares restantes están balanceados y no se listan.
      </div>`;
  }
  html += `</div>`;
  return html;
}

const BORDER = {
  top:    { style:'thin', color:{argb:'FFB0B7BF'} },
  left:   { style:'thin', color:{argb:'FFB0B7BF'} },
  bottom: { style:'thin', color:{argb:'FFB0B7BF'} },
  right:  { style:'thin', color:{argb:'FFB0B7BF'} }
};

function styleHeaderRow(ws, row, cols, opts) {
  for (let c = 1; c <= cols; c++) {
    const cell = ws.getCell(row, c);
    cell.border = BORDER;
    cell.font = Object.assign({ size: 11 }, opts.font || {});
    if (opts.fill) cell.fill = { type:'pattern', pattern:'solid', fgColor: { argb: opts.fill } };
    if (c >= 3) { cell.numFmt = '#,##0.00'; cell.alignment = { horizontal:'center', vertical:'middle' }; }
    else { cell.alignment = { horizontal:'left', vertical:'middle' }; }
  }
}

  const d = DATA[sk];
  const ws = wb.addWorksheet(sk);

  ws.getCell(r,1).alignment = { horizontal:'center', vertical:'middle' };
  ws.getRow(r).height = 26;
  r++;
  ws.getCell(r,1).value = d.subtitulo + ' · C. Costo ' + d.ccosto;
  ws.mergeCells(r,1,r,4);
  ws.getCell(r,1).font = { size:11, color:{argb:'FF555555'} };
  ws.getCell(r,1).alignment = { horizontal:'center' };
  r++;
  ws.getCell(r,1).value = CONFIG.periodo ? 'Período: ' + CONFIG.periodo : 'Cuentas 696-100 / 696-200';
  ws.mergeCells(r,1,r,4);
  ws.getCell(r,1).font = { size:10, color:{argb:'FF777777'} };
  ws.getCell(r,1).alignment = { horizontal:'center' };
  r++;
  r++;

  ['AGENCIAS','C. COSTO','696-100','696-200'].forEach((h,i)=>{
    const c = ws.getCell(r, i+1);
    c.value = h;
    c.font = { bold:true, color:{argb:'FFFFFFFF'}, size:11 };

    c.border = BORDER;
    c.alignment = { horizontal: i===0?'left':'center', vertical:'middle' };
  });
  ws.getRow(r).height = 22;
  r++;

  const cuadreRow = r; r++;

  let territorioRow = null;
  if (d.territorio) {
    territorioRow = r;
    ws.getCell(r,1).value = 'TERRITORIO';

  let totalCostoRow = null, agenciasStart = null, agenciasEnd = null;

    totalCostoRow = r; r++;

      ws.getCell(r,1).value = a.nombre;
      ws.getCell(r,2).value = a.cc;
      ws.getCell(r,3).value = a.v100;
      ws.getCell(r,4).value = a.v200;
      ws.getCell(r,3).protection = { locked:false };
      ws.getCell(r,4).protection = { locked:false };
      styleHeaderRow(ws, r, 4, { font:{size:10} });

  }

  let dirGralRow = null;

    dirGralRow = r;
    ws.getCell(r,1).value = 'DIRECCION GENERAL';
    ws.getCell(r,2).value = '150';
    ws.getCell(r,3).value = d.dirGral.v100;
    ws.getCell(r,4).value = d.dirGral.v200;
    ws.getCell(r,3).protection = { locked:false };
    ws.getCell(r,4).protection = { locked:false };
    styleHeaderRow(ws, r, 4, { font:{bold:true}, fill:'FFE2E8F0' });
    r++;
  }

  const otrosStart = r;
  d.otros.forEach(o => {
    ws.getCell(r,1).value = o.nombre;
    ws.getCell(r,2).value = o.cc;
    ws.getCell(r,3).value = o.v100;
    ws.getCell(r,4).value = o.v200;
    ws.getCell(r,3).protection = { locked:false };
    ws.getCell(r,4).protection = { locked:false };
    styleHeaderRow(ws, r, 4, { font:{size:10} });
    r++;
  });
  const otrosEnd = r - 1;

  const totalOtrosRow = r;
  ws.getCell(r,1).value = 'TOTAL OTROS TERRIT.';
  ws.getCell(r,3).value = { formula:`SUM(C${otrosStart}:C${otrosEnd})` };
  ws.getCell(r,4).value = { formula:`SUM(D${otrosStart}:D${otrosEnd})` };
  styleHeaderRow(ws, r, 4, { font:{bold:true}, fill:'FFCBD5E0' });
  r++;

  const totalCuentasRow = r;
  ws.getCell(r,1).value = 'TOTAL POR CUENTAS';
  styleHeaderRow(ws, r, 4, { font:{bold:true, color:{argb:'FFFFFFFF'}}, fill:'FF2C5282' });
  r++;

  const saldoRow = r;
  ws.getCell(r,1).value = 'SALDO CUENTAS CONTAB.';
  ws.getCell(r,3).value = d.saldo100;
  ws.getCell(r,4).value = d.saldo200;
  ws.getCell(r,3).protection = { locked:false };
  ws.getCell(r,4).protection = { locked:false };
  styleHeaderRow(ws, r, 4, { font:{bold:true}, fill:'FFCBD5E0' });
  r++;

  const difRow = r;
  ws.getCell(r,1).value = 'DIFERENCIA';
  ws.getCell(r,3).value = { formula:`C${totalCuentasRow}-C${saldoRow}` };
  ws.getCell(r,4).value = { formula:`D${totalCuentasRow}-D${saldoRow}` };
  styleHeaderRow(ws, r, 4, { font:{bold:true, color:{argb:'FFFFFFFF'}}, fill:'FF2C5282' });
  r++;

  r++;
  ws.getCell(r,1).value = 'CERTIFICA: ______________________________';
  ws.getCell(r,3).value = 'RECIBIDO POR: ______________________________';
  ws.mergeCells(r,3,r,4);
  r++;
  ws.getCell(r,1).value = d.cert;
  ws.getCell(r,3).value = d.recibido;
  ws.mergeCells(r,3,r,4);

  let cF100, cF200;
  if (d.territorio) {
    cF100 = `C${territorioRow}+C${totalCostoRow}`;
    cF200 = `D${territorioRow}+D${totalCostoRow}`;
  } else if (sk === 'SERVICIOS TECNICOS') {
    cF100 = `C${dirGralRow}+C${totalOtrosRow}`;
    cF200 = `D${dirGralRow}+D${totalOtrosRow}`;
  } else {
    cF100 = `C${totalOtrosRow}`;
    cF200 = `D${totalOtrosRow}`;
  }
  ws.getCell(cuadreRow,1).value = 'CUADRE DE LA REGION';
  ws.getCell(cuadreRow,3).value = { formula:cF100 };
  ws.getCell(cuadreRow,4).value = { formula:cF200 };
  styleHeaderRow(ws, cuadreRow, 4, { font:{bold:true}, fill:'FFE2E8F0' });

  if (totalCostoRow) {
    ws.getCell(totalCostoRow,1).value = 'TOTAL C. COSTO';
    ws.getCell(totalCostoRow,3).value = { formula:`SUM(C${agenciasStart}:C${agenciasEnd})` };
    ws.getCell(totalCostoRow,4).value = { formula:`SUM(D${agenciasStart}:D${agenciasEnd})` };
    styleHeaderRow(ws, totalCostoRow, 4, { font:{bold:true}, fill:'FFCBD5E0' });
  }

  let tp100, tp200;
  if (d.territorio) {
    tp100 = `C${cuadreRow}+C${dirGralRow}+C${totalOtrosRow}`;
    tp200 = `D${cuadreRow}+D${dirGralRow}+D${totalOtrosRow}`;
  } else {
    tp100 = `C${cuadreRow}`;
    tp200 = `D${cuadreRow}`;
  }
  ws.getCell(totalCuentasRow,3).value = { formula:tp100 };
  ws.getCell(totalCuentasRow,4).value = { formula:tp200 };

  ws.protect('', {
    selectLockedCells:true, selectUnlockedCells:true,
    formatCells:false, formatColumns:false, formatRows:false,
    insertColumns:false, insertRows:false,
    deleteColumns:false, deleteRows:false
  });
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}

async function exportSheet(sk) {
  try {
    const wb = new ExcelJS.Workbook();
    wb.creator = 'AGESP.SA';
    buildSheet(wb, sk);
    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    downloadBlob(blob, `AGESP_${sk}_plantilla.xlsx`);
    showToast('✓ Plantilla de ' + sk + ' exportada');
  } catch (e) { alert('Error al exportar: ' + e.message); }
}

async function exportAll() {
  try {
    const wb = new ExcelJS.Workbook();
    wb.creator = 'AGESP.SA';
    Object.keys(DATA).forEach(sk => buildSheet(wb, sk));
    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    downloadBlob(blob, 'AGESP_plantilla_completa.xlsx');
    showToast('✓ Plantilla completa exportada');
  } catch (e) { alert('Error al exportar: ' + e.message); }
}

function triggerImport() { document.getElementById('importFile').click(); }

function getNumericValue(cell) {
  if (!cell || cell.value === null || cell.value === undefined) return null;
  const v = cell.value;
  if (typeof v === 'number') return v;
  if (typeof v === 'string') {
    const n = parseFloat(v.replace(/,/g,'').trim());
    return isNaN(n) ? null : n;
  }
  if (typeof v === 'object') {
    if (v.result !== undefined && v.result !== null) {
      const n = parseFloat(v.result);
      return isNaN(n) ? null : n;
    }
    if (v.richText) {
      const s = v.richText.map(t => t.text).join('');
      const n = parseFloat(s.replace(/,/g,'').trim());
      return isNaN(n) ? null : n;
    }
  }
  return null;
}

async function handleImport(input) {
  const file = input.files[0];
  if (!file) return;
  try {
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(await file.arrayBuffer());
    let updatedSheets = 0, updatedValues = 0;
    wb.eachSheet(ws => {
      const sk = ws.name;
      if (!DATA[sk]) return;
      const d = DATA[sk];
      let thisSheetUpdates = 0;
      ws.eachRow(row => {
        const label = String(row.getCell(1).value || '').trim();
        const cc = String(row.getCell(2).value || '').trim();
        if (label === 'TERRITORIO' && d.territorio) {
          const a = getNumericValue(row.getCell(3));
          const b = getNumericValue(row.getCell(4));
          if (a !== null) d.territorio.v100 = a;
          if (b !== null) d.territorio.v200 = b;
          if (a !== null || b !== null) thisSheetUpdates++;
        }
        else if (label === 'DIRECCION GENERAL') {
          const a = getNumericValue(row.getCell(3));
          const b = getNumericValue(row.getCell(4));
          if (a !== null) d.dirGral.v100 = a;
          if (b !== null) d.dirGral.v200 = b;
          if (a !== null || b !== null) thisSheetUpdates++;
        }
        else if (label === 'SALDO CUENTAS CONTAB.') {
          const a = getNumericValue(row.getCell(3));
          const b = getNumericValue(row.getCell(4));
          if (a !== null) d.saldo100 = a;
          if (b !== null) d.saldo200 = b;
          if (a !== null || b !== null) thisSheetUpdates++;
        }
        else if (cc) {
          const ag = d.agencias.find(x => x.cc === cc);
          if (ag) {
            const a = getNumericValue(row.getCell(3));
            const b = getNumericValue(row.getCell(4));
            if (a !== null) ag.v100 = a;
            if (b !== null) ag.v200 = b;
            if (a !== null || b !== null) thisSheetUpdates++;
          } else {
            const ot = d.otros.find(x => x.cc === cc);
            if (ot) {
              const a = getNumericValue(row.getCell(3));
              const b = getNumericValue(row.getCell(4));
              if (a !== null) ot.v100 = a;
              if (b !== null) ot.v200 = b;
              if (a !== null || b !== null) thisSheetUpdates++;
            }
          }
        }
      });
      if (thisSheetUpdates > 0) { updatedSheets++; updatedValues += thisSheetUpdates; }
    });

    if (updatedSheets === 0) {
      alert('No se encontraron hojas compatibles en el archivo. Asegúrese de importar una plantilla exportada desde esta aplicación.');
    } else {
      saveData();
      rerender(currentSheet);
      showToast(`✓ Importado: ${updatedValues} valores en ${updatedSheets} hoja(s)`);
    }
  } catch (e) { alert('Error al importar: ' + e.message); }
  input.value = '';
}
